<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' file:; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <title>拾阶英语 · 你的英语学习空间</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="mobile.css">
</head>
<body>
  <aside class="sidebar" aria-label="主导航">
    <a class="brand" href="#home" aria-label="拾阶英语首页"><span class="brand-mark"><svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="m10 15 12 4v20l-12-4Z" fill="#b8b3d1"/><path d="m23 19 15-5v20l-15 5Z" fill="#faf5e8"/><path d="m23 20 12-6v20l-12 5Z" fill="#dcd7e9"/><path d="m23 20 9-6V9l-9 5Z" fill="#faf5e8"/><path d="m23 14 9-5v21l-9 9Z" fill="#faf5e8"/><path d="m27 12 3-2v8l-1.5-.7L27 19Z" fill="#e8a36e"/><path d="m13 22 6 2m-6 3 4 1.3" stroke="#eee9f7" stroke-width="1.3" stroke-linecap="round"/></svg></span><span>拾阶英语<small>STEPWISE ENGLISH</small></span></a>
    <p class="nav-label">学习空间</p><nav id="nav"></nav>
    <div class="sidebar-bottom">
      <div class="offline-card"><span class="status-dot"></span><strong>专注学习，随时离线</strong><p>课程已在本机，按自己的节奏来。</p></div>
      <button class="nav-button" id="settingsButton"></button>
      <div class="sidebar-foot"><span>为每一点进步而设计</span><span>v0.2</span></div>
    </div>
  </aside>
  <button id="menuBackdrop" aria-label="关闭菜单" tabindex="-1"></button>
  <main id="main">
    <header class="topbar"><button id="mobileMenu" aria-label="打开学习菜单" aria-expanded="false" aria-controls="nav">☰ 菜单</button><div class="breadcrumb"><span>我的学习空间</span><span class="divider">/</span><strong id="crumb">今日学习</strong></div><button id="globalSearch" class="search-trigger" aria-label="搜索全部课程"></button><span class="top-offline"><span class="status-dot"></span>离线就绪</span></header>
    <div id="storageWarning" class="storage-warning" role="alert" hidden></div>
    <div id="view"></div>
    <footer class="page-footer"><span>STEPWISE ENGLISH</span><span>从读懂一句，到表达自己。</span></footer>
  </main>
  <nav id="mobileNav" aria-label="手机快捷导航"></nav>
  <div id="toast" role="status" hidden></div>
  <dialog id="searchDialog" aria-labelledby="searchTitle"><div class="dialog-heading"><h2 id="searchTitle">找到今天想学的内容</h2><button class="icon-button" id="closeSearch" aria-label="关闭搜索"></button></div><label class="search-box"><span id="searchIcon"></span><input id="allSearch" type="search" placeholder="输入标题或课程编号，如 R01、Welcome" aria-label="搜索全部课程"></label><div id="searchResults"></div><p class="dialog-hint">按 Esc 关闭 · 全部内容均可离线学习</p></dialog>
  <input id="importFile" type="file" accept="application/json" hidden>
  <script src="data.js"></script><script src="state.js"></script><script src="mobile.js"></script><script src="app.js"></script>
</body>
</html>
